<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Chanchal Admin</title>

<link rel="manifest" href="./manifest.json">

<link rel="icon" type="image/svg+xml" href="./icon.svg">

<meta name="theme-color" content="#ec4899">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#121212;
    color:white;
    font-family:Arial,sans-serif;
}

.header{
    padding:20px;
    background:#1d1d1d;
    font-size:22px;
    font-weight:bold;
}

.container{
    padding:15px;
}

.user-card{
    background:#1d1d1d;
    padding:15px;
    border-radius:12px;
    margin-bottom:10px;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}

.user-card:active{
    opacity:0.8;
}

.user-name{
    font-size:18px;
    font-weight:bold;
}

.mobile{
    color:#aaa;
    margin-top:5px;
}

#chatArea{
    display:none;
}

.profile{
    background:#1d1d1d;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
}

.chat-box{
    min-height:350px;
    max-height:450px;
    overflow-y:auto;
    background:#181818;
    padding:15px;
    border-radius:12px;
}

.message{
    padding:12px;
    margin-bottom:10px;
    border-radius:12px;
    max-width:80%;
}

.user{
    background:#7c3aed;
    margin-left:auto;
}

.owner{
    background:#333;
}

.input-area{
    display:flex;
    gap:8px;
    margin-top:10px;
}

input{
    flex:1;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#1d1d1d;
    color:white;
}

button{
    padding:15px;
    border:none;
    border-radius:10px;
    background:#ec4899;
    color:white;
}

</style>

</head>

<body>

<div class="header">
Connect Owner Panel
</div>

<div class="container">

<div id="userList">
Loading users...
</div>

<div id="chatArea">

<div class="profile" id="profileInfo">
</div>

<div
id="adminChatBox"
class="chat-box">
</div>

<div class="input-area">

<input
id="adminMessage"
placeholder="Type reply..."

>

<button onclick="sendReply()">
Send
</button>

</div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    onChildAdded,
    push,
    remove
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

    apiKey: "AIzaSyCNSUPfxSqJ1XwhIP5o-OHmVbGxs9DEyoI",

    authDomain: "myapp-7f265.firebaseapp.com",

    databaseURL:
    "https://myapp-7f265-default-rtdb.firebaseio.com",

    projectId: "myapp-7f265",

    storageBucket:
    "myapp-7f265.firebasestorage.app",

    messagingSenderId:
    "307312975781",

    appId:
    "1:307312975781:web:44df62abc416ba7f68924c"

};


const app =
initializeApp(firebaseConfig);


const database =
getDatabase(app);


let selectedUserId = "";


const chatsRef =
ref(
    database,
    "customerCare/chats"
);


onValue(

    chatsRef,

    function(snapshot){

        const userList =
        document.getElementById("userList");


        userList.innerHTML = "";


        snapshot.forEach(function(child){

            const user =
            child.val();


            const profile =
            user.profile;


            if(!profile){

                return;

            }


            const card =
            document.createElement("div");


            card.className =
            "user-card";


            card.innerHTML =

            "<div class='user-name'>" +
            (profile.name || "") +
            "</div>" +

            "<div class='mobile'>" +
            (profile.mobile || "") +
            "</div>";


            card.onclick =
            function(){

                openChat(
                    child.key,
                    profile
                );

            };


            addLongPressDelete(
                card,
                child.key,
                profile.name || "this user"
            );


            userList.appendChild(card);

        });

    }

);


/* LONG PRESS DELETE */

function addLongPressDelete(
    element,
    userId,
    userName
){

    let pressTimer = null;

    let longPressTriggered = false;


    function startPress(){

        longPressTriggered = false;


        pressTimer =
        setTimeout(
            function(){

                longPressTriggered = true;


                const confirmDelete =
                confirm(
                    "Delete chat of " +
                    userName +
                    "?\n\nThis will permanently delete this user's profile and complete chat from Firebase."
                );


                if(confirmDelete){

                    deleteUserChat(
                        userId
                    );

                }

            },
            700
        );

    }


    function cancelPress(){

        if(pressTimer !== null){

            clearTimeout(
                pressTimer
            );

            pressTimer = null;

        }

    }


    element.addEventListener(
        "touchstart",
        startPress,
        {
            passive:true
        }
    );


    element.addEventListener(
        "touchend",
        cancelPress
    );


    element.addEventListener(
        "touchcancel",
        cancelPress
    );


    element.addEventListener(
        "touchmove",
        cancelPress
    );


    element.addEventListener(
        "mousedown",
        startPress
    );


    element.addEventListener(
        "mouseup",
        cancelPress
    );


    element.addEventListener(
        "mouseleave",
        cancelPress
    );


    element.addEventListener(
        "contextmenu",
        function(event){

            event.preventDefault();

        }
    );

}


/* DELETE USER CHAT */

function deleteUserChat(
    userId
){

    const userRef =
    ref(
        database,
        "customerCare/chats/" +
        userId
    );


    remove(userRef)

    .then(function(){

        if(selectedUserId === userId){

            selectedUserId = "";


            document
            .getElementById("userList")
            .style.display = "block";


            document
            .getElementById("chatArea")
            .style.display = "none";


            document
            .getElementById("adminChatBox")
            .innerHTML = "";


            document
            .getElementById("profileInfo")
            .innerHTML = "";

        }


        alert(
            "Chat deleted successfully."
        );

    })

    .catch(function(error){

        console.error(
            "Delete error:",
            error
        );


        alert(
            "Chat delete nahi hui.\n\n" +
            error.message
        );

    });

}


window.openChat = function(
    id,
    profile
){

    selectedUserId = id;


    document
    .getElementById("userList")
    .style.display = "none";


    document
    .getElementById("chatArea")
    .style.display = "block";


    document
    .getElementById("profileInfo")
    .innerHTML =

    "<b>Name:</b> " +
    (profile.name || "") +

    "<br><br><b>Mobile:</b> " +
    (profile.mobile || "") +

    "<br><br><b>Age:</b> " +
    (profile.age || "") +

    "<br><br><b>City:</b> " +
    (profile.city || "") +

    "<br><br><b>About:</b> " +
    (profile.about || "");


    const chatBox =
    document.getElementById(
        "adminChatBox"
    );


    chatBox.innerHTML = "";


    const messagesRef =

    ref(
        database,
        "customerCare/chats/" +
        selectedUserId +
        "/messages"
    );


    onChildAdded(

        messagesRef,

        function(snapshot){

            const data =
            snapshot.val();


            if(!data){

                return;

            }


            const div =
            document.createElement("div");


            div.className =
            "message " +
            data.sender;


            div.innerText =
            data.message || "";


            chatBox.appendChild(div);


            chatBox.scrollTop =
            chatBox.scrollHeight;

        }

    );

};


window.sendReply = function(){

    const input =
    document.getElementById(
        "adminMessage"
    );


    const message =
    input.value.trim();


    if(message === ""){

        return;

    }


    if(selectedUserId === ""){

        alert("Select a user first");

        return;

    }


    push(

        ref(
            database,
            "customerCare/chats/" +
            selectedUserId +
            "/messages"
        ),

        {

            message: message,

            sender: "owner",

            timestamp: Date.now()

        }

    );


    input.value = "";

};


/* ADMIN PWA */

if("serviceWorker" in navigator){

    window.addEventListener(
        "load",
        function(){

            navigator.serviceWorker.register(
                "./sw.js",
                {
                    scope: "./"
                }
            ).catch(function(error){

                console.log(
                    "Service Worker error:",
                    error
                );

            });

        }
    );

}

</script>

</body>

</html>
